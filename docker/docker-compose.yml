services:
  postgres:
    image: postgres:17-alpine
    container_name: fingraph-postgres
    environment:
      POSTGRES_DB: fingraph_db
      POSTGRES_USER: fingraph_user
      POSTGRES_PASSWORD: fingraph_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: fingraph-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fingraph-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: